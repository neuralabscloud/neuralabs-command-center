- id: base-set-1999
  topic: base set
  title: "Base Set reached US shelves in 1999 with 102 cards, 16 of them holo rares"
  summary: "The English Base Set released on 9 January 1999 in the United States. It has 102 cards, including 16 holographic rares such as Charizard, Blastoise and Venusaur."
  source: Bulbapedia
  url: https://bulbapedia.bulbagarden.net/wiki/Base_Set_(TCG)
  date: 1999-01-09
  numbers: [102, 16, 1999]
