  topic: tcg history
  title: "The Pokémon TCG launched in Japan in October 1996, two years before Base Set"
  summary: "The Pokémon Trading Card Game first released in Japan on 20 October 1996. The English Base Set followed in the US on 9 January 1999."
  source: Bulbapedia
  url: https://bulbapedia.bulbagarden.net/wiki/Pok%C3%A9mon_Trading_Card_Game
