  topic: base set
  title: "Base Set has 16 holo rares out of 102 cards"
  summary: "Of the 102 cards in Base Set, numbers 1 to 16 are the holographic rares, from Alakazam to Zapdos. Charizard is card 4/102."
  source: Bulbapedia
  url: https://bulbapedia.bulbagarden.net/wiki/Base_Set_(TCG)
  numbers: [16, 102]
  entities: [release]
  layouts: [number, signal]

