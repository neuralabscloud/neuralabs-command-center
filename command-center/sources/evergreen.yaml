- id: edu-wei-gwei
  topic: gas units
  title: "1 ETH is 1,000,000,000 gwei"
  summary: "Ether has small units like sats in Bitcoin. 1 gwei is 0.000000001 ETH, so 1 ETH is 1,000,000,000 gwei. Gas prices in wallets are shown in gwei."
  source: ethereum.org
  url: https://ethereum.org/en/developers/docs/gas/
  numbers: [1000000000, 1]
  entities: [Ethereum, Gas]
  layouts: [signal]

