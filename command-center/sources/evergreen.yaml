  title: "The Lightning Network whitepaper came out in 2016"
  summary: "Lightning moves Bitcoin payments off chain through payment channels and settles on chain later. The idea was published by Joseph Poon and Thaddeus Dryja in 2016. It is built for small, fast payments."
  source: Wikipedia
  url: https://en.wikipedia.org/wiki/Lightning_Network
