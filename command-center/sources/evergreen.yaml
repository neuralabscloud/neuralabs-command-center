- id: edu-gas-21000
  topic: gas
  title: "A plain ETH transfer always uses 21,000 gas"
  summary: "Sending ETH from one address to another uses exactly 21,000 gas units. Swaps and other contract calls use more because they run code. The fee is gas used times the gas price."
  source: ethereum.org
  url: https://ethereum.org/en/developers/docs/gas/
  numbers: [21000]
  entities: [Ethereum, Gas]
  layouts: [signal]

- id: edu-block-time
  topic: confirmations
  title: "Bitcoin makes about 144 blocks a day"
  summary: "Bitcoin targets one block every 10 minutes, about 144 blocks a day. Many services wait for 6 confirmations, roughly an hour, before they treat a large payment as final."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Confirmation
  numbers: [144, 10, 6]
  entities: [Bitcoin]
  layouts: [signal]

