  summary: "Perpetual futures have no expiry, so a funding payment keeps their price near spot. When funding is positive, longs pay shorts. On Hyperliquid it is paid every hour, on many exchanges every 8 hours."
  source: Hyperliquid docs
  url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/funding
  numbers: [1, 8]
  entities: [Trading, Hyperliquid]
  layouts: [signal]

