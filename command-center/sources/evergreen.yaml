# gh0stlayer news cards: evergreen pool. Verifiable protocol facts, each with a source URL.
# Format (own minimal parser, sources/evergreen.js): "- key: value" starts an item; values in [..] or {..} are JSON.
# Used when the day's news scores low, and by --dry-run to cover every layout.
# Order matters on equal scores: educational items (edu-*) and history alternate 2:1 (2026-11-20).

- id: edu-seed-phrase
  topic: seed phrase
  title: "Your seed phrase is 12 or 24 words from a list of 2,048"
  summary: "Most wallets follow BIP39: the recovery phrase is 12 or 24 words picked from a fixed list of 2,048 words. Anyone with those words controls the wallet. No real support team, exchange or airdrop will ever ask for them."
  source: BIP39
  url: https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki
  numbers: [12, 24, 2048]
  entities: [Wallet, Security]
  layouts: [signal]

- id: edu-multisig
  topic: multisig
  title: "A 2-of-3 multisig survives one lost or stolen key"
  summary: "A multisignature wallet needs several keys to sign. In a 2-of-3 setup there are three keys and any two can move funds, so one lost or stolen key is not fatal."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Multi-signature
  numbers: [2, 3]
  entities: [Bitcoin, Wallet, Security]
  layouts: [signal]

- id: btc-halving-schedule
  title: "Bitcoin's block subsidy fell to 3.125 BTC at the April 2024 halving"
  summary: "The block subsidy halves every 210,000 blocks: 50 BTC at launch, 25 at block 210,000 (2012), 12.5 at 420,000 (2016), 6.25 at 630,000 (2020) and 3.125 at 840,000 (20 April 2024)."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Controlled_supply
  date: 2024-04-20
  numbers: [3.125, 6.25, 12.5, 25, 50, 210000, 840000]
  entities: [Bitcoin, Miners]
  layouts: [number, versus, signal]
  series: [["2009", 50], ["2012", 25], ["2016", 12.5], ["2020", 6.25], ["2024", 3.125]]
  versus: {"left": {"label": "2020 halving", "value": "6.25", "unit": "BTC per block"}, "right": {"label": "2024 halving", "value": "3.125", "unit": "BTC per block"}}

- id: edu-scams-ic3
  topic: scams
  title: "Crypto investment fraud was the costliest scam the FBI tracked in 2023"
  summary: "The FBI's 2023 Internet Crime Report lists investment fraud as the costliest crime type, with crypto investment schemes the largest part. The common pattern: a friendly contact, a fake trading platform with fake profits, then fees to withdraw."
  source: FBI IC3
  url: https://www.ic3.gov/AnnualReport/Reports/2023_IC3Report.pdf
  numbers: [2023]
  entities: [Security, Scams]
  layouts: [signal]

- id: edu-token-approvals
  topic: token approvals
  title: "A token approval can stay open long after you used the app"
  summary: "ERC-20 tokens, standardised in 2015 (EIP-20), let you approve a contract to spend your tokens. Many apps ask for an unlimited amount. That permission stays until you revoke it, so a hacked or malicious contract can still drain the token later."
  source: Revoke.cash
  url: https://revoke.cash/learn/approvals/what-are-token-approvals
  numbers: [2015, 20]
  entities: [Ethereum, Wallet, Security]
  layouts: [signal]

- id: btc-supply-cap
  title: "Bitcoin's supply is capped at 21 million coins, each split into 100,000,000 sats"
  summary: "The protocol caps total supply just under 21 million BTC. One bitcoin is 100,000,000 satoshis, the smallest unit on chain."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Controlled_supply
  numbers: [21000000, 100000000]
  entities: [Bitcoin]
  layouts: [number, signal]

- id: edu-celsius
  topic: custody
  title: "Celsius froze withdrawals on 12 June 2022"
  summary: "On 12 June 2022 lender Celsius paused all withdrawals, swaps and transfers, and filed for bankruptcy in July. Users who held coins there could not move them. Coins on a platform are a claim on that platform, not coins in your own wallet."
  source: Wikipedia
  url: https://en.wikipedia.org/wiki/Celsius_Network
  date: 2022-06-12
  numbers: [2022, 12]
  entities: [Custody, Exchange]
  layouts: [signal]

