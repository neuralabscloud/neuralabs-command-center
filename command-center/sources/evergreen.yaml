- id: eth-london-1559
  title: "Since the London upgrade in August 2021, Ethereum burns the base fee of every transaction"
  summary: "EIP-1559 shipped with the London upgrade on 5 August 2021. Every transaction pays a base fee that is burned, plus an optional tip to the block proposer."
  source: ethereum.org
  url: https://ethereum.org/en/history/
  date: 2021-08-05
  numbers: [1559]
  entities: [Ethereum]
  layouts: [signal]

