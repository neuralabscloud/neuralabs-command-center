- id: edu-address-types
  topic: addresses
  title: "Bitcoin addresses start with 1, 3 or bc1, and that tells you the type"
  summary: "Legacy Bitcoin addresses start with 1, script addresses with 3, and native SegWit and Taproot addresses with bc1. Newer bc1 addresses usually mean lower fees. Always check the full address, not just the first and last characters."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Invoice_address
  numbers: [1, 3]
  entities: [Bitcoin, Wallet]
  layouts: [signal]

