  title: "Bitcoin's genesis block was mined on 3 January 2009"
  summary: "Block 0, the genesis block, is dated 3 January 2009. Its 50 BTC coinbase output cannot be spent."
  source: Bitcoin Wiki
  url: https://en.bitcoin.it/wiki/Genesis_block
  date: 2009-01-03
  numbers: [50]
