- id: edu-leverage-math
  topic: leverage
  title: "At 10x leverage a 10% move against you can wipe out your margin"
  summary: "Leverage multiplies both directions. At 10x, a 10% move against the position equals 100% of the margin, and liquidation usually comes earlier because of maintenance margin. At 50x it takes about 2%."
  source: Hyperliquid docs
  url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/liquidations
