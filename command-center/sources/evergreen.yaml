- id: edu-apr-apy
  topic: apr vs apy
  title: "10% APR compounded daily is about 10.52% APY"
  summary: "APR is the simple yearly rate. APY includes compounding. 10% APR compounded daily works out to about 10.52% APY. In DeFi, check which one is shown, and whether the reward token holds its value."
  source: Investor.gov
  url: https://www.investor.gov/financial-tools-calculators/calculators/compound-interest-calculator
  numbers: [10, 10.52]
  entities: [DeFi, Yield]
  layouts: [signal]

- id: edu-dca
  topic: dca
  title: "Dollar cost averaging: the same amount on a fixed schedule"
  summary: "Dollar cost averaging means buying a fixed amount at fixed times, for example 100 dollars every month, whatever the price. It spreads the entry over time. It does not prevent losses when the price keeps falling."
  source: Investor.gov
  url: https://www.investor.gov/introduction-investing/investing-basics/glossary/dollar-cost-averaging
  numbers: [100, 12]
  entities: [Trading]
  layouts: [signal]

