<html lang="en">
<head>

<link rel="stylesheet" href="/theme.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Operations Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/iso-office.css">
<style>
/* ── CSS VARIABLES ──────────────────────────────── */
:root {
  --bg-deep: hsl(0 0% 0%);
  --bg-base: hsl(0 0% 3%);
  --bg-surface: hsl(0 0% 5%);
  --bg-card: hsl(0 0% 5%);
  --bg-card-hover: hsl(0 0% 8%);
  --bg-sidebar: hsl(0 0% 2%);
  --border: hsl(217 32% 20%);
  --border-glow: hsla(264 65% 49% / 0.3);
  --primary: hsl(264 65% 49%);
  --primary-dim: hsla(264 65% 49% / 0.5);
  --primary-glow: hsla(264 65% 65% / 0.4);
  --accent: hsl(264 65% 49%);
  --accent-dim: hsla(264 65% 49% / 0.5);
  --success: hsl(142 76% 36%);
  --success-dim: hsla(142 76% 36% / 0.4);
  --danger: hsl(0 72% 51%);
  --danger-dim: hsla(0 72% 51% / 0.4);
  --warning: hsl(45 93% 55%);
  --warning-dim: hsla(45 93% 55% / 0.4);
  --premium: hsl(270 95% 65%);
  --text: hsl(210 40% 98%);
  --text-dim: hsl(215 20% 65%);
  --text-muted: hsl(217 32% 17%);
  --font-display: 'Akira Expanded', 'Orbitron', sans-serif;
  --font-data: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 10px;
  --sidebar-w: 62px;
  --feed-w: 272px;
}

/* ── RESET ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ATMOSPHERIC BG ─────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, hsla(264 65% 49% / 0.024) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, hsla(264 65% 49% / 0.024) 0%, transparent 60%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(var(--text-muted) 1px, transparent 1px),
    linear-gradient(90deg, var(--text-muted) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.04;
  pointer-events: none;
}

/* ── LAYOUT ─────────────────────────────────────── */
.layout {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ── LEFT SIDEBAR ───────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
}
.sidebar-logo {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 900;
  color: var(--primary);
  letter-spacing: 0.2em;
  margin-bottom: 28px;
  text-shadow: 0 0 20px var(--primary-glow);
}
.sidebar-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.nav-item {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  border: 1px solid transparent;
  text-decoration: none;
}
.nav-item:hover { color: var(--primary); background: hsla(264 65% 49% / 0.03); }
.nav-item.active {
  color: var(--primary);
  background: hsla(264 65% 49% / 0.063);
  border-color: var(--border-glow);
  box-shadow: 0 0 16px hsla(264 65% 49% / 0.063);
}
.nav-item .tooltip {
  position: absolute;
  left: 52px; top: 50%;
  transform: translateY(-50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-family: var(--font-body);
  color: var(--text);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.nav-item:hover .tooltip { opacity: 1; }
.nav-item svg { width: 18px; height: 18px; }

/* ── MAIN CONTENT ───────────────────────────────── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  margin-right: var(--feed-w);
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── HEADER ─────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
  font-family: var(--font-data);
}
.header-right {
  display: flex; align-items: center; gap: 14px;
}
.status-badge {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-data);
  font-size: 11px;
  color: var(--success);
  background: hsla(142 76% 36% / 0.03);
  border: 1px solid hsla(142 76% 36% / 0.125);
  padding: 5px 12px;
  border-radius: 20px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse-glow 2s infinite;
}

/* ── BRIEFING BANNER ────────────────────────────── */
.briefing {
  background: linear-gradient(180deg, hsl(0 0% 5%), hsl(0 0% 3%));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 26px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  position: relative;
  overflow: hidden;
}
.briefing::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary-dim), transparent);
}
.briefing-item-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: var(--font-data);
  margin-bottom: 8px;
}
.briefing-item-value {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.briefing-item-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  font-family: var(--font-data);
}

/* ── SECTION HEADERS ────────────────────────────── */
.section-header {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ── AGENT CARDS (retro space) ───────────────────── */
.agents-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.ac {
  --ac: 264 65% 49%;
  --ac-status: hsl(215 16% 55%);
  position: relative;
  container-type: inline-size;
  aspect-ratio: 2 / 3;
  display: flex;
  flex-direction: column;
  padding: 22px 22px 18px;
  border-radius: 16px;
  border: 1px solid hsla(0 0% 100% / 0.08);
  background: radial-gradient(120% 85% at 50% 32%, hsl(228 58% 13%) 0%, hsl(232 52% 7%) 48%, hsl(240 30% 3%) 100%);
  color: hsl(0 0% 100%);
  text-decoration: none;
  isolation: isolate;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, box-shadow 0.3s;
}
.ac:hover, .ac:focus-visible {
  transform: translateY(-4px);
  border-color: hsla(var(--ac) / 0.75);
  box-shadow: 0 14px 44px hsla(var(--ac) / 0.22), 0 0 0 1px hsla(var(--ac) / 0.25);
  outline: none;
}
.ac.ready   { --ac-status: hsl(45 93% 55%); }
.ac.running { --ac-status: hsl(142 76% 45%); }
.ac.error   { --ac-status: hsl(0 72% 55%); }
.ac.idle    { --ac-status: hsl(215 16% 45%); }

/* Background layers: clipped here so the card itself can grow with its content */
.ac-bg { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: -1; pointer-events: none; }
.ac-stars, .ac-stars::after {
  position: absolute; inset: 0;
  background-position: var(--sx, 0) var(--sy, 0);
}
.ac-stars {
  background-image:
    radial-gradient(1px 1px at 18px 24px, hsla(0 0% 100% / 0.9) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92px 61px, hsla(0 0% 100% / 0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 151px 18px, hsla(0 0% 100% / 0.5) 50%, transparent 51%),
    radial-gradient(2px 2px at 64px 142px, hsla(0 0% 100% / 0.85) 50%, transparent 51%),
    radial-gradient(1px 1px at 178px 118px, hsla(0 0% 100% / 0.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 120px 190px, hsla(0 0% 100% / 0.45) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 30px 205px, hsla(0 0% 100% / 0.55) 50%, transparent 51%);
  background-size: 200px 220px;
  animation: ac-twinkle 7s ease-in-out infinite;
}
.ac-stars::after {
  content: '';
  background-image:
    radial-gradient(1px 1px at 40px 80px, hsla(0 0% 100% / 0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 128px 36px, hsla(0 0% 100% / 0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 96px 128px, hsla(0 0% 100% / 0.8) 50%, transparent 51%),
    radial-gradient(1px 1px at 12px 150px, hsla(0 0% 100% / 0.4) 50%, transparent 51%);
  background-size: 160px 170px;
  animation: ac-twinkle 11s ease-in-out infinite reverse;
}
.ac-spark {
  position: absolute;
  width: 9px; height: 9px;
  background: hsl(0 0% 100%);
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
  filter: drop-shadow(0 0 3px hsla(0 0% 100% / 0.8));
  animation: ac-sparkle 5s ease-in-out infinite;
}
.ac-floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 35%;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to top, hsl(0 0% 0%) 20%, transparent 100%);
          mask-image: linear-gradient(to top, hsl(0 0% 0%) 20%, transparent 100%);
}
.ac-floor::before {
  content: '';
  position: absolute; left: -60%; right: -60%; bottom: 0; height: 220%;
  background-image:
    linear-gradient(hsla(0 0% 100% / 0.06) 1px, transparent 1px),
    linear-gradient(90deg, hsla(0 0% 100% / 0.06) 1px, transparent 1px);
  background-size: 34px 34px;
  transform: perspective(220px) rotateX(62deg);
  transform-origin: bottom center;
  animation: ac-floor 6s linear infinite;
}

/* Content */
.ac-model {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: hsl(215 16% 62%);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ac-name {
  margin-top: 8px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: clamp(28px, 13cqi, 56px); font-weight: 800; line-height: 1; letter-spacing: -0.03em;
  color: hsl(0 0% 100%);
}
.ac-hero { position: relative; flex: 1; min-height: 120px; display: grid; place-items: center; margin: 10px 0; }
.ac-glow {
  position: absolute; width: 78cqi; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, hsla(var(--ac) / 0.42) 0%, hsla(var(--ac) / 0.12) 38%, transparent 66%);
  animation: ac-pulse 4s ease-in-out infinite;
  transition: opacity 0.3s, transform 0.3s;
}
.ac:hover .ac-glow { opacity: 1; filter: brightness(1.45); }
.ac-sprite {
  position: relative; width: 55cqi; height: auto;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 14px hsla(var(--ac) / 0.45));
  animation: ac-float 3s ease-in-out infinite;
}
.ac-initials {
  position: relative; width: 34cqi; aspect-ratio: 1;
  display: grid; place-items: center;
  font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 9cqi;
  color: hsl(0 0% 100%);
  background: hsla(var(--ac) / 0.14);
  border: 3px solid hsl(var(--ac));
  box-shadow: 0 0 26px hsla(var(--ac) / 0.55), inset 0 0 18px hsla(var(--ac) / 0.35);
  text-shadow: 0 0 10px hsla(var(--ac) / 0.9);
  animation: ac-float 3s ease-in-out infinite;
}
.ac-role { font-size: 16px; line-height: 1.4; color: hsla(0 0% 100% / 0.85); }
.ac-divider { height: 1px; margin: 14px 0 12px; background: hsla(0 0% 100% / 0.1); }
.ac-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ac-stat-label { font-size: 11px; color: hsl(215 16% 58%); margin-bottom: 3px; }
.ac-stat-value { font-size: 20px; font-weight: 700; color: hsl(0 0% 100%); font-variant-numeric: tabular-nums; }
.ac-status {
  align-self: flex-end; margin-top: 12px;
  display: flex; align-items: center; gap: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: hsla(0 0% 100% / 0.75);
}
.ac-dashes { display: flex; gap: 3px; }
.ac-dashes i { width: 8px; height: 2px; background: var(--ac-status); box-shadow: 0 0 6px var(--ac-status); }
.ac.idle .ac-dashes i { box-shadow: none; }
.ac.running .ac-dashes i { animation: ac-dash 1.2s ease-in-out infinite; }
.ac.running .ac-dashes i:nth-child(2) { animation-delay: 0.2s; }
.ac.running .ac-dashes i:nth-child(3) { animation-delay: 0.4s; }
.ac.running .ac-status-text::after { content: '_'; margin-left: 1px; animation: agent-task-blink 1s step-end infinite; }
.ac:hover .ac-dashes i { box-shadow: 0 0 8px hsla(var(--ac) / 0.9); }

@keyframes agent-task-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes ac-twinkle { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes ac-sparkle { 0%, 100% { opacity: 0.25; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1); } }
@keyframes ac-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes ac-pulse { 0%, 100% { opacity: 0.75; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
@keyframes ac-floor { from { background-position: 0 0; } to { background-position: 0 34px; } }
@keyframes ac-dash { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

@media (max-width: 1100px) {
  .agents-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .agents-grid {
    grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: min(78%, 320px);
    overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .agents-grid::-webkit-scrollbar { display: none; }
  .main, section:has(> .agents-grid) { min-width: 0; max-width: 100%; }
  .ac { scroll-snap-align: start; padding: 18px 18px 16px; }
  .ac-role { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .ac, .ac * , .ac *::before, .ac *::after { animation: none !important; }
  .ac { transition: border-color 0.3s, box-shadow 0.3s; }
  .ac:hover, .ac:focus-visible { transform: none; }
}

/* ── KANBAN ──────────────────────────────────────── */
.kanban {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.kanban-col {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 160px;
}
.kanban-col-header {
  font-family: var(--font-data);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.kanban-count {
  background: var(--bg-card);
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 10px;
  color: var(--text-dim);
}
.kanban-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 12px;
  cursor: default;
  transition: all 0.2s;
}
.kanban-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 0 16px hsla(264 65% 49% / 0.024);
}
.kanban-card-tag {
  font-family: var(--font-data);
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 3px;
  display: inline-block;
  margin-top: 6px;
}

/* ── SOP LIBRARY ────────────────────────────────── */
.sop-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.sop-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: all 0.25s;
}
.sop-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 0 24px hsla(264 65% 49% / 0.03);
}
.sop-title {
  font-family: var(--font-data);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}
.sop-desc {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 12px;
  line-height: 1.5;
}
.sop-btn {
  font-family: var(--font-data);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: hsla(264 65% 49% / 0.063);
  color: var(--primary);
  border: 1px solid hsla(264 65% 49% / 0.145);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.sop-btn:hover {
  background: hsla(264 65% 49% / 0.094);
  box-shadow: 0 0 20px hsla(264 65% 49% / 0.08);
}

/* ── RIGHT FEED ─────────────────────────────────── */
.feed {
  width: var(--feed-w);
  position: fixed;
  right: 0; top: 0; bottom: 0;
  background: var(--bg-sidebar);
  border-left: 1px solid var(--border);
  padding: 20px 16px;
  overflow-y: auto;
  z-index: 100;
}
.feed-title {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--primary);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.feed-title .live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse-glow 2s infinite;
}
.feed-item {
  padding: 12px 0;
  border-bottom: 1px solid hsla(217 32% 20% / 0.094);
}
.feed-item-time {
  font-family: var(--font-data);
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.feed-item-text {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-dim);
}
.feed-item-text strong { color: var(--text); font-weight: 500; }
.feed-tag {
  font-family: var(--font-data);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  display: inline-block;
  margin-top: 4px;
}
.task-feed-row {
  padding: 10px 0 10px 8px;
  border-bottom: 1px solid hsla(217 32% 20% / 0.2);
  border-left: 2px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.task-feed-row.is-processing { border-left-color: var(--primary); }
.task-feed-row.is-pending { border-left-color: var(--warning); }
.task-feed-row.is-completed { border-left-color: var(--success); opacity: 0.7; }
.task-feed-row.is-failed { border-left-color: var(--danger); opacity: 0.7; }
.task-feed-row.is-cancelled { border-left-color: var(--text-dim); opacity: 0.6; }
.task-feed-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.task-feed-tag {
  font-family: var(--font-data);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
}
.task-feed-time {
  font-family: var(--font-data);
  font-size: 9px;
  color: var(--text-muted);
}
.task-feed-desc {
  font-size: 11px;
  color: var(--text);
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.task-feed-status {
  font-family: var(--font-data);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ── ANIMATIONS ─────────────────────────────────── */
@keyframes pulse-glow {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50% { opacity: 0.6; box-shadow: 0 0 8px 2px currentColor; }
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up {
  opacity: 0;
  animation: fade-up 0.5s ease-out forwards;
}
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.10s; }
.delay-3 { animation-delay: 0.15s; }
.delay-4 { animation-delay: 0.20s; }
.delay-5 { animation-delay: 0.25s; }
.delay-6 { animation-delay: 0.30s; }
.delay-7 { animation-delay: 0.35s; }
.delay-8 { animation-delay: 0.40s; }

/* ── SCROLLBAR ──────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── MOBILE NAV BUTTONS ────────────────────────── */
.mobile-nav { display: none; }
.mobile-nav-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.mobile-nav-btn:hover, .mobile-nav-btn.active { color: var(--primary); border-color: var(--border-glow); }
.mobile-nav-btn svg { width: 18px; height: 18px; }
.mobile-overlay {
  display: none;
  position: fixed; inset: 0;
  background: hsla(0 0% 0% / 0.6);
  z-index: 90;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.mobile-overlay.visible { display: block; }

/* ── RESPONSIVE: TABLET (≤1024px) ──────────────── */
@media (max-width: 1024px) {
  :root { --feed-w: 0px; }
  .feed {
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    z-index: 110;

  .feed.open { transform: translateX(0); }

  .sidebar.open { transform: translateX(0); }
  :root { --sidebar-w: 0px; }
  .main { margin-right: 0; margin-left: 0; }
  .briefing { grid-template-columns: repeat(2, 1fr); }
  .fade-up.delay-6 { grid-template-columns: 1fr !important; }
  .kanban { grid-template-columns: repeat(3, 1fr); }
  .sop-grid { grid-template-columns: repeat(2, 1fr); }
  .mobile-nav { display: flex; gap: 8px; }
}

/* ── RESPONSIVE: MOBILE (≤768px) ───────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }

  /* Sidebar becomes bottom bar */
  .sidebar, .sidebar.open {
    position: fixed;
    left: 0; right: 0; bottom: 0; top: auto;
    width: 100%; min-height: auto; height: auto;
    flex-direction: row;

  .sidebar::after {

  }
  .sidebar-logo { display: none; }
  .sidebar-nav {
    flex-direction: row;

  }
  .nav-item {

  .nav-item .tooltip { display: none; }

  /* Hide hamburger on mobile, sidebar is always visible as bottom bar */

  .briefing { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
  .briefing-item-value { font-size: 13px; }

  .sop-grid { grid-template-columns: 1fr; }

}

/* ── RESPONSIVE: SMALL MOBILE (≤480px) ─────────── */
@media (max-width: 480px) {
  .main { padding: 12px; gap: 16px; }
  .header-title { font-size: 14px; }

  .nav-item svg { width: 15px; height: 15px; }
}

</head>
<body>

<div class="mobile-overlay" id="mobile-overlay" onclick="closeAllMobile()"></div>
<div class="layout">

  <!-- ── LEFT SIDEBAR ──────────────────────────── -->
  <aside class="sidebar">
  </aside>

  <!-- ── MAIN CONTENT ──────────────────────────── -->
  <main class="main">

    <!-- HEADER -->
    <div class="header fade-up delay-1">

          <button class="mobile-nav-btn" id="feed-btn" onclick="toggleFeed()" aria-label="Activity feed">

    <section class="fade-up delay-6">
      <div style="background:linear-gradient(180deg,hsl(0 0% 5%) 0%,hsl(0 0% 3%) 100%);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:var(--font-data);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim)">System Health</div>
          <div id="sys-host-label" style="font-family:var(--font-data);font-size:10px;color:var(--text-muted)"></div>

<script>
// ── DATE/TIME ──────────────────────────────────
function updateTime() {
  const now = new Date();
  document.getElementById('datetime').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
    ' — ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
updateTime();
setInterval(updateTime, 1000);

// ── BRAND TITLE ────────────────────────────────
fetch('/brand', { credentials: 'include' })
  .then(r => r.ok ? r.json() : null)
  .then(b => {
    if (!b || !b.company_name) return;
    const el = document.getElementById('header-title');
    if (el) el.textContent = String(b.company_name).toUpperCase() + ' COMMAND CENTER';
  })
  .catch(() => {});

// ── SYSTEM HEALTH ────────────────────────────
function sysLineChart(values, color, { height = 54, max = null, fill = true } = {}) {
  const vals = (values && values.length) ? values : [0];
  const w = 100, h = height;
  const mx = max !== null ? max : Math.max(1, ...vals);
  const pts = vals.map((v, i) => {
    const x = vals.length > 1 ? (i / (vals.length - 1)) * w : w / 2;
    const y = h - (v / mx) * (h - 4) - 2;
    return x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
  const fillPts = vals.length > 1 ? `${0},${h} ${pts} ${w},${h}` : `${0},${h} ${pts} ${w},${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    ${fill ? `<polygon points="${fillPts}" fill="${color}" opacity="0.12"/>` : ''}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function fmtBytes(n) {
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB'];
  let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
}

function statTile({ label, value, sub, color = 'var(--text)', chart = '', accent = 'var(--primary)' }) {
  return `<div style="background:hsl(0 0% 4%);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:110px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
      <div style="font-family:var(--font-data);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim)">${label}</div>
      <div style="font-size:10px;color:var(--text-muted);font-family:var(--font-data)">${sub || ''}</div>
    </div>
    <div style="font-family:var(--font-data);font-size:22px;font-weight:600;color:${color};letter-spacing:-0.01em">${value}</div>
    <div style="margin-top:auto">${chart}</div>
  </div>`;
}

function pctColor(p) {
  return p > 85 ? 'var(--danger)' : p > 70 ? 'var(--warning)' : 'var(--success)';
}

async function renderSystemHealth() {
  const el = document.getElementById('system-health');
  const hostEl = document.getElementById('sys-host-label');
  try {
    const [services, health] = await Promise.all([
      fetch('/settings/services', { credentials: 'include' }).then(r => r.json()).catch(() => []),
      fetch('/system/health', { credentials: 'include' }).then(r => r.json()).catch(() => ({})),
    ]);
    if (health.error || !health.uptime_human) {
      el.innerHTML = '<div style="color:var(--danger);font-size:11px">Could not load health data</div>';
      return;
    }

    const hist = health.history || {};
    const cpu = health.cpu || {};
    const mem = health.memory || {};
    const disk = health.disk || {};
    const swap = health.swap || {};
    const net = health.network || {};

    if (hostEl) hostEl.textContent = `${health.hostname} · ${health.os} · Node ${health.node_version}`;

    const tilesTop = [
      statTile({
        label: 'CPU Usage', value: cpu.pct + '%',
        sub: cpu.cores + ' cores',
        color: pctColor(cpu.pct || 0),
        chart: sysLineChart(hist.cpu, 'hsl(264 65% 60%)', { max: 100 })
      }),
      statTile({
        label: 'Memory', value: mem.pct + '%',
        sub: `${(mem.used_mb/1024).toFixed(1)}/${(mem.total_mb/1024).toFixed(1)} GB`,
        color: pctColor(mem.pct || 0),
        chart: sysLineChart(hist.mem, 'hsl(142 70% 45%)', { max: 100 })
      }),
      statTile({
        label: 'Disk', value: disk.pct + '%',
        sub: `${Math.round((disk.used_mb||0)/1024)}/${Math.round((disk.total_mb||0)/1024)} GB`,
        color: pctColor(disk.pct || 0),
        chart: sysLineChart(hist.disk, 'hsl(45 93% 55%)', { max: 100 })
      }),
      statTile({
        label: 'Network', value: fmtBytes(net.rx_per_sec) + '/s',
        sub: '↑ ' + fmtBytes(net.tx_per_sec) + '/s',
        color: 'hsl(210 90% 60%)',
        chart: sysLineChart(hist.net_rx, 'hsl(210 90% 60%)', { fill: true })
      }),
    ];

    const loadAvgColor = (cpu.load1 || 0) > cpu.cores ? 'var(--danger)' : (cpu.load1 || 0) > cpu.cores * 0.7 ? 'var(--warning)' : 'var(--success)';
    const tilesBottom = [
      statTile({ label: 'Uptime', value: health.uptime_human, sub: '', color: 'var(--text)', chart: '' }),
      statTile({ label: 'Load Avg', value: (cpu.load1 || 0).toFixed(2), sub: `${(cpu.load5||0).toFixed(2)} / ${(cpu.load15||0).toFixed(2)}`, color: loadAvgColor, chart: '' }),
      statTile({ label: 'Processes', value: health.processes || '—', sub: 'running', color: 'var(--text)', chart: '' }),
      statTile({ label: 'Swap', value: (swap.total_mb||0) === 0 ? 'N/A' : (swap.pct + '%'), sub: (swap.total_mb||0) === 0 ? 'disabled' : `${Math.round(swap.used_mb)}/${Math.round(swap.total_mb)} MB`, color: (swap.total_mb||0) === 0 ? 'var(--text-dim)' : pctColor(swap.pct || 0), chart: '' }),
    ];

    // Services list (left column) + top processes (right column)
    const servicesHtml = services.length ? services.map(svc => {
      const online = svc.status === 'online';
      const dot = online ? 'var(--success)' : 'var(--danger)';
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid hsla(217 32% 20% / 0.25)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:7px;height:7px;border-radius:50%;background:${dot};box-shadow:0 0 8px ${dot}"></span>
          <span style="font-size:11px;color:var(--text)">${svc.label}</span>
        </div>
        <span style="font-size:9px;color:${dot};font-weight:600;text-transform:uppercase;letter-spacing:0.06em">${online ? 'Online' : 'Offline'}</span>
      </div>`;
    }).join('') : '<div style="padding:14px;color:var(--text-dim);font-size:11px">No services reported</div>';

    const procsHtml = (health.top_processes || []).length ? health.top_processes.map(p => `
      <div style="display:grid;grid-template-columns:1fr 60px 60px;gap:8px;padding:6px 10px;border-bottom:1px solid hsla(217 32% 20% / 0.25);font-family:var(--font-data);font-size:11px;align-items:center">
        <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="PID ${p.pid}">${p.name}</span>
        <span style="color:${p.cpu > 50 ? 'var(--danger)' : p.cpu > 20 ? 'var(--warning)' : 'var(--text-dim)'};text-align:right">${p.cpu.toFixed(1)}% cpu</span>
        <span style="color:${p.mem > 10 ? 'var(--warning)' : 'var(--text-dim)'};text-align:right">${p.mem.toFixed(1)}% mem</span>
      </div>`).join('') : '<div style="padding:14px;color:var(--text-dim);font-size:11px">No process data</div>';

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${tilesTop.join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px">${tilesBottom.join('')}</div>
      <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px">
        <div style="background:hsl(0 0% 4%);border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <div style="padding:10px 12px;font-family:var(--font-data);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border)">Services</div>
          ${servicesHtml}
        </div>
        <div style="background:hsl(0 0% 4%);border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <div style="padding:10px 12px;font-family:var(--font-data);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 60px 60px;gap:8px">
            <span>Top Processes</span><span style="text-align:right">CPU</span><span style="text-align:right">MEM</span>
          </div>
          ${procsHtml}
        </div>
      </div>`;
  } catch (e) {
    el.innerHTML = '<div style="color:var(--danger);font-size:11px">Could not load health data</div>';
  }
}

renderSystemHealth();
setInterval(renderSystemHealth, 10000);

// ── AI TEAM ───────────────────────────────────
// Cards come from /agents/overview (agents, model, status and stats live in the backend).
// The DOM is built once per agent set and then patched, so the animations never restart.
function acRand(seed) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0; return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
function acInitials(name) {
  return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function agentCardHtml(a) {
  const rnd = acRand(a.id);
  const sparks = [0, 1, 2].map(i => {
    const top = (6 + rnd() * 52).toFixed(1), left = (6 + rnd() * 88).toFixed(1);
    return `<span class="ac-spark" style="top:${top}%;left:${left}%;animation-delay:${(i * 1.7 + rnd()).toFixed(2)}s"></span>`;
  }).join('');
  const hero = a.sprite
    ? `<img class="ac-sprite" src="${escTask(a.sprite)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ac-initials',textContent:'${acInitials(a.name)}'}))">`
    : `<div class="ac-initials">${escTask(acInitials(a.name))}</div>`;
  const stats = (a.stats || []).slice(0, 2).map((st, i) =>
    `<div><div class="ac-stat-label">${escTask(st.label)}</div><div class="ac-stat-value" data-stat="${i}">${escTask(st.value)}</div></div>`).join('');
  return `<a class="ac ${escTask(a.status)}" href="${escTask(a.href || 'agents.html')}" data-id="${escTask(a.id)}"
      style="--ac:${escTask(a.hsl || '264 65% 49%')};--sx:${Math.round(rnd() * 200)}px;--sy:${Math.round(rnd() * 220)}px">
    <div class="ac-bg"><div class="ac-stars"></div>${sparks}<div class="ac-floor"></div></div>
    <div class="ac-model">${escTask(a.model)}</div>
    <div class="ac-name">${escTask(a.name)}</div>
    <div class="ac-hero"><div class="ac-glow"></div>${hero}</div>
    <div class="ac-role">${escTask(a.role)}</div>
    <div class="ac-divider"></div>
    <div class="ac-stats">${stats}</div>
    <div class="ac-status"><span class="ac-dashes"><i></i><i></i><i></i></span><span class="ac-status-text">${escTask(a.status)}</span></div>
  </a>`;
}
function updateAgentCard(a) {
  const el = document.querySelector(`.ac[data-id="${CSS.escape(a.id)}"]`);
  if (!el) return;
  for (const s of ['ready', 'running', 'error', 'idle']) el.classList.toggle(s, s === a.status);
  el.querySelector('.ac-status-text').textContent = a.status;
  el.querySelector('.ac-model').textContent = a.model || '';
  (a.stats || []).slice(0, 2).forEach((st, i) => {
    const v = el.querySelector(`[data-stat="${i}"]`);
    if (v && v.textContent !== String(st.value)) v.textContent = st.value;
  });
}
async function renderAiTeam() {
  let agents;
  try { agents = await (await fetch('/agents/overview')).json(); } catch { return; }
  if (!Array.isArray(agents)) return;
  const grid = document.getElementById('ai-team-grid');
  const key = agents.map(a => `${a.id}:${a.sprite || ''}:${(a.stats || []).map(s => s.label).join('|')}`).join(',');
  if (grid.dataset.key !== key) {
    grid.innerHTML = agents.map(agentCardHtml).join('');
    grid.dataset.key = key;
  } else {
    agents.forEach(updateAgentCard);
  }
}
renderAiTeam();
setInterval(renderAiTeam, 10000);

// ── AGENT TASK FEED (right sidebar) ────────────
const TASK_FEED_SOURCES = [
  { api: '/ugc/tasks',          agent: 'CONTENT',  subtype: 'UGC',        color: 'hsl(180 70% 45%)' },
  { api: '/designer/tasks',     agent: 'DESIGN',   subtype: 'DESIGN',     color: 'var(--warning)' },
  { api: '/video/tasks',        agent: 'VIDEO',    subtype: 'REMOTION',   color: 'var(--danger)' },
  { api: '/video/ai-generate',  agent: 'VIDEO',    subtype: 'AI GEN',     color: 'var(--danger)' },
];

function fmtTaskTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const diff = Date.now() - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return d.toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function escTask(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function loadTaskFeed() {
  const el = document.getElementById('task-feed-list');
  if (!el) return;
  const all = [];
  await Promise.all(TASK_FEED_SOURCES.map(async src => {
    try {
      const tasks = await (await fetch(src.api)).json();
      if (Array.isArray(tasks)) {
        tasks.forEach(t => all.push({
          ...t,
          _agent: src.agent,
          _subtype: src.subtype,
          _color: src.color,
          _desc: t.description || t.topic || t.query || t.prompt || t.design_type || '-',
        }));
      }
    } catch {}
  }));

  all.sort((a, b) => {
    const order = { processing: 0, pending: 1, completed: 2, failed: 3, cancelled: 4 };
    const oa = order[a.status] ?? 5, ob = order[b.status] ?? 5;
    if (oa !== ob) return oa - ob;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const list = all.slice(0, 25);
  if (!list.length) {
    el.innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:12px 0">No tasks yet</div>';
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="task-feed-row is-${t.status}">
      <div class="task-feed-meta">
        <span class="task-feed-tag" style="color:${t._color};background:${t._color}15">${t._subtype}</span>
        <span class="task-feed-time">${fmtTaskTime(t.created_at)}</span>
      </div>
      <div class="task-feed-desc">${escTask(t._desc)}</div>
      <div class="task-feed-status" style="color:${t._color}">${t.status}</div>
    </div>
  `).join('');
}
loadTaskFeed();
setInterval(loadTaskFeed, 10000);

// ── MOBILE NAVIGATION ─────────────────────────
function toggleSidebar() {
  // Only used on tablet (≤1024 & >768) — on mobile sidebar is bottom bar
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const feed = document.querySelector('.feed');
  feed.classList.remove('open');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('visible', sidebar.classList.contains('open'));
}
function toggleFeed() {
  const feed = document.querySelector('.feed');
  const overlay = document.getElementById('mobile-overlay');
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.remove('open');
  feed.classList.toggle('open');
  overlay.classList.toggle('visible', feed.classList.contains('open'));
}
function closeAllMobile() {
  document.querySelector('.sidebar').classList.remove('open');
  document.querySelector('.feed').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('visible');
}
// Close panels on resize back to desktop
window.addEventListener('resize', function() {
  if (window.innerWidth > 1024) closeAllMobile();
});
</script>
