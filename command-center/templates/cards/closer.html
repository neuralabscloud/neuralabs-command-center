<!-- layout: closer. One line + a question. -->
<div class="card closer">
  <div style="position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 55%, hsl(264 65% 40% / .4), transparent 70%)"></div>
  {{top}}
  <div class="body" style="top:330px">
    <h2 class="headline fit" data-max="78" data-min="44" style="max-height:420px">{{line}}</h2>
    <div style="width:120px;height:6px;border-radius:3px;background:var(--accent);margin:56px 0;box-shadow:0 0 18px var(--accent)"></div>
    <p style="font:600 46px/1.3 var(--body);color:var(--fg)">{{question}}</p>
  </div>
  {{foot}}
</div>
