<!-- layout: signal. Full-bleed AI image (4:5), headline over the lower half. -->
<div class="card signal">
  <div class="bg-img" style="background-image:url('{{image}}')"></div>
  <div class="shade"></div>
  {{top}}
  <div class="body" style="bottom:170px">
    <h1 class="headline fit" data-max="104" data-min="58" style="max-height:520px">{{headline}}</h1>
    <p class="hint" style="margin-top:30px">{{hint}}</p>
  </div>
  {{foot}}
</div>
