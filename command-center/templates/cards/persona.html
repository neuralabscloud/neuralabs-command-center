<!-- layout: persona. gh0st still, first-person past-tense headline in quotes. -->
<div class="card persona">
  <div class="bg-img persona-frame" style="background-image:url('{{image}}');background-position:center 20%"></div>
  <div class="shade" style="background:linear-gradient(180deg,hsl(0 0% 0% / .2) 0%,hsl(0 0% 0% / .1) 35%,hsl(0 0% 0% / .9) 66%,hsl(0 0% 0%) 100%)"></div>
  {{top}}
  <div class="body" style="bottom:170px">
    <div style="font:400 120px/0.6 var(--display);color:var(--accent);height:60px">&ldquo;</div>
    <h1 class="headline fit" data-max="88" data-min="48" style="max-height:470px;text-transform:none">{{headline}}</h1>
    <p class="hint" style="margin-top:28px">{{hint}}</p>
  </div>
  {{foot}}
</div>
