<div class="vault listing">
  <div class="zone">{{pattern}}<div class="vglow"></div><div class="fade"></div></div>
  <div class="slabbox"><img src="{{photo}}" alt=""></div>
  <div class="vtop">{{brand}}<span class="pill">for sale</span></div>
  <div class="text">
    <div class="line1">{{line1}}</div>
    <div class="vhead fit" data-max="60" data-min="38" style="max-height:130px">{{card}}</div>
    <div class="chips">{{chips}}</div>
  </div>
  <div class="vfoot">
    <div class="l"><div class="k">asking</div><div class="price">{{price}}</div></div>
    <div class="r"><div class="k">available on</div><div class="v">{{platform}} · link in bio</div></div>
  </div>
</div>
