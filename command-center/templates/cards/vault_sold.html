<div class="vault sold">
  <div class="zone">{{pattern}}<div class="fade"></div></div>
  <div class="slabbox"><img src="{{photo}}" alt=""></div>
  <div class="stamp">SOLD</div>
  <div class="vtop">{{brand}}<span class="pill">sold</span></div>
  <div class="text">
    <div class="line1">{{line1}}</div>
    <div class="vhead fit" data-max="60" data-min="38" style="max-height:130px">{{card}}</div>
    <div class="chips">{{chips}}</div>
  </div>
  <div class="vfoot">
    <div class="l">{{sold_left}}</div>
    <div class="r"><div class="k">next drop</div><div class="v">turn on notifications</div></div>
  </div>
</div>
